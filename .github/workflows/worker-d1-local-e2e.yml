name: Verificar Worker y D1 local - Factor de Gigantes
on:
  workflow_dispatch:
  # Lanzar una única prueba de la migración 0003; retirar al comenzar.
  push:
    branches: [main]
    paths:
      - '.github/workflows/worker-d1-local-e2e.yml'
permissions:
  contents: read
jobs:
  d1-local-e2e:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Wrangler sin credenciales remotas
        run: npm install --no-audit --no-fund
      - name: Aplicar tres migraciones solo en D1 local aislada
        run: |
          npx wrangler d1 migrations apply factor-de-gigantes-db --local --persist-to "$RUNNER_TEMP/factor-local-d1"
          npx wrangler d1 execute factor-de-gigantes-db --local --persist-to "$RUNNER_TEMP/factor-local-d1" --command "SELECT name FROM sqlite_master WHERE type='table' AND name='editorial_dossiers';"
          npx wrangler d1 execute factor-de-gigantes-db --local --persist-to "$RUNNER_TEMP/factor-local-d1" --command "SELECT name FROM sqlite_master WHERE type='table' AND name='research_requests';"
      - name: Probar API, D1 real local, seguridad y revocación de aprobación
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --persist-to "$RUNNER_TEMP/factor-local-d1" --ip 127.0.0.1 --port 8797 --var ADMIN_TOKEN:factor-local-admin-e2e-test-000000000000 --var RENDERER_TOKEN:factor-local-renderer-e2e-000000000000 > "$RUNNER_TEMP/factor-local-worker.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          started=0
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8797/health > /dev/null; then started=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$started" != "1" ]; then
            echo 'No inició el Worker local:'
            tail -n 50 "$RUNNER_TEMP/factor-local-worker.log"
            exit 1
          fi
          node tests/e2e_worker_local.mjs
