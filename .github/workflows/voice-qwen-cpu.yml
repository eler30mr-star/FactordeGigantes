name: Prueba Qwen local sin pagos - CPU
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voice-qwen-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-only:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HOME: /tmp/qwen-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar voz aprobada y recursos gratuitos
        run: |
          python -m tools.approved_voice --check
          free -h
          df -h .
      - name: Instalar PyTorch exclusivo CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Instalar dependencias sin CUDA ni FlashAttention
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg sox
          python -m pip install 'qwen-tts==0.1.1' --no-deps
          python -m pip install 'transformers==4.57.3' 'accelerate==1.12.0' librosa soundfile sox onnxruntime einops
      - name: Generar narración breve en CPU y medir tiempos
        run: |
          /usr/bin/time -v python -m tools.qwen_local_smoke
      - name: Entregar muestra y métricas solo si se generan
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-qwen-cpu-gratis
          path: dist/cpu-smoke-qwen/
          retention-days: 4
          if-no-files-found: error
