name: Audición Qwen - toma íntegra sin cortes de vocales
on:
  push:
    branches: [main]
    paths:
      - 'tools/audition_qwen_retake.py'
      - '.github/workflows/voice-qwen-clone.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  toma-natural:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar voz de referencia verificable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/referencia-qwen
          gh run download 39504363557 --repo "${{ github.repository }}" \
            --name audicion-qwen-voz-masculina-factor-de-gigantes \
            --dir dist/referencia-qwen
          test -s dist/referencia-qwen/Qwen3_FactorDeGigantes_DiccionProfesional.mp3
      - name: Preparar herramientas gratuitas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install 'gradio_client>=1.15,<3'
      - name: Verificar pronunciación y sintetizar toda la toma de nuevo
        run: |
          python - <<'PY'
          from tools.voice_lexicon import spoken_text
          assert spoken_text("BlackBerry") == "Blákberri"
          assert spoken_text("Durante años, BlackBerry parecía invencible.").startswith("Durante años, ")
          PY
          python -m tools.audition_qwen_retake
      - name: Publicar solo nueva muestra de audición
        uses: actions/upload-artifact@v4
        with:
          name: qwen-narrador-toma-natural-sin-cortes
          path: dist/retake-natural/
          if-no-files-found: error
          retention-days: 3
