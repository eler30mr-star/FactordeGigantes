name: Comprobar base
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audiovisual-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reutilizar archivo FFmpeg verificado
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fdg-ffmpeg/ffmpeg.tar.xz
          key: ffmpeg-linux64-97ce978979194b5cf7e06a5e68020dbdaa7a4f3294c5452b6a1bc347100dbb79
      - name: Preparar FFmpeg fijado para pruebas sobre archivos reales
        run: bash tools/setup_ci_ffmpeg.sh
      - name: Verificar detección de exportaciones defectuosas sin IA ni voz nueva
        env:
          FDG_MEDIA_QA_INTEGRATION: '1'
          PYTHONPATH: '.:tests'
        run: |
          python -m pip install 'Pillow==11.3.0'
          python -m unittest tests.test_av_quality tests.test_episode_engine -v
      - name: Comprobar reproducción, audio, pausa, desplazamiento y recuperación en Chromium sin IA
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m tools.browser_video_acceptance --out dist/browser-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fdg-browser-player-acceptance
          path: dist/browser-acceptance/
          retention-days: 7
          if-no-files-found: warn
  production-smoke:
    needs: [checks, audiovisual-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar panel desplegado después de los contratos
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          python - <<'PY'
          import hashlib,json,os,time
          from pathlib import Path
          from tools.production_smoke import probe
          expected=hashlib.sha256(Path('public/app.js').read_bytes()).hexdigest()
          for attempt in range(6):
              try:
                  report=probe(os.environ['API_BASE_URL'])
                  if report['production_ready'] and report['checks']['/app.js'].get('sha256')==expected:
                      print('PANEL_DESPLEGADO:',json.dumps(report,ensure_ascii=False))
                      break
              except Exception as exc:
                  print('Consulta no disponible:',type(exc).__name__)
              if attempt==5:raise SystemExit('El panel desplegado aún no coincide con este código; revisar despliegue.')
              print('Esperando sincronización del despliegue; sin iniciar producción ni IA.')
              time.sleep(8)
          PY
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Revisar sintaxis JS
        run: |
          node --check src/youtube-publication.mjs
          node --check public/youtube-publication.js
          node --check src/channel-research.mjs
          node --check src/opportunity-control.mjs
          node --check src/opportunity-study.mjs
          node --check src/video-preview.mjs
          node --check public/video-preview.js
          node --check src/channel-control.mjs
          node --check public/channel-control.js
          node --check src/worker.js
          node --check src/autonomous-script-drafts.mjs
          node --check src/episode-production.mjs
          node --check src/production-progress.mjs
          node --check src/youtube-connection.mjs
          node --check src/youtube-exports.mjs
          node --check src/ai-research-team.mjs
          node --check src/market-radar.mjs
          node --check src/market-ingest.mjs
          node --check src/github-oidc.mjs
          node --check src/news-ingest.mjs
          node --check src/news-triage.mjs
          node --check src/youtube-market.mjs
          node --check src/market-cross-signals.mjs
          node --check src/news-entity-ingest.mjs
          node --check src/market-assessment.mjs
          node --check src/market-official-ingest.mjs
          node --check src/market-pdf-ingest.mjs
          node --check src/market-research-ingest.mjs
          node --check src/market-research-selection.mjs
          node --check src/research-control.mjs
          node --check src/system-readiness.mjs
          node --check public/app.js
          node --check public/dossier-editor.js
          node --check public/youtube-review.js
      - name: Dependencias de pruebas PDF y animación local
        run: python -m pip install 'pypdf==5.9.0' 'Pillow==11.3.0'
      - name: Pruebas de contratos del renderizador
        run: python -m unittest discover -s tests -v
      - name: Verificar seguridad editorial en API Worker y contrato D1
        run: node --test tests/test_channel_progress.mjs tests/test_youtube_publication.mjs tests/test_channel_research.mjs tests/test_opportunity_study.mjs tests/test_video_preview.mjs tests/test_channel_control.mjs tests/test_editorial_gate.mjs tests/test_dossier_editor.mjs tests/test_research_control.mjs tests/test_system_readiness.mjs tests/test_market_radar_api.mjs tests/test_market_ingest.mjs tests/test_github_oidc.mjs tests/test_news_ingest.mjs tests/test_news_triage.mjs tests/test_youtube_market.mjs tests/test_market_cross_signals.mjs tests/test_news_entity_ingest.mjs tests/test_market_assessment.mjs tests/test_market_official_ingest.mjs tests/test_market_pdf_ingest.mjs tests/test_market_research_ingest.mjs tests/test_market_research_selection.mjs tests/test_ai_research_team.mjs tests/test_autonomous_script_drafts.mjs tests/test_episode_production.mjs tests/test_production_progress.mjs tests/test_youtube_connection.mjs tests/test_youtube_exports.mjs
      - name: Aceptar el MP4 existente con el mismo extractor del reproductor
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[preview-e2e]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/eler30mr-star/FactordeGigantes/actions/artifacts/12588892336/zip > /tmp/fdg-preview.zip
          node tools/video_preview_smoke.mjs /tmp/fdg-preview.zip
      - name: Validar manifest de ejemplo
        run: python tools/render.py --manifest examples/documental.json --validate-only

      - name: Consultar progreso de producción real sin iniciar trabajos
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/production_progress_smoke.mjs

      - name: Comprobar Worker y panel de produccion sin credenciales
        # No bloqueante: un commit de codigo puede preceder al despliegue.
        continue-on-error: true
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: python -m tools.production_smoke

      - name: Diagnosticar conexion HTTP a Cloudflare
        # Chequeo no bloqueante: distinguir secreto API_BASE_URL incorrecto de HTTP 403 externo.
        continue-on-error: true
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          base = os.environ.get("API_BASE_URL", "").rstrip("/")
          host = urllib.parse.urlsplit(base).hostname
          expected = "factor-de-gigantes.martin30-eler.workers.dev"
          print("API_BASE_URL corresponde al Worker esperado:", host == expected)
          if host != expected:
              raise SystemExit("La URL configurada en GitHub Actions no corresponde al Worker")
          request = urllib.request.Request(
              base + "/health",
              headers={"User-Agent": "FactorDeGigantes-CI/1.0", "Accept": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  body = response.read(400)
                  print("HTTP /health:", response.status)
                  print("Respuesta del Worker esperado:", b'Factor de Gigantes' in body)
          except urllib.error.HTTPError as exc:
              print("HTTP /health:", exc.code)
              print("Server:", exc.headers.get("Server", "?"))
              print("CF-Ray presente:", bool(exc.headers.get("CF-Ray")))
              print("Content-Type:", exc.headers.get("Content-Type", "?"))
              raise SystemExit(1)
          PY

      - name: Diagnosticar autenticacion del renderizador
        # Consulta un UUID imposible: 404 confirma autenticación, sin alterar un trabajo.
        continue-on-error: true
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          RENDERER_TOKEN: ${{ secrets.RENDERER_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          base = os.environ.get("API_BASE_URL", "").rstrip("/")
          token = os.environ.get("RENDERER_TOKEN", "")
          if len(token) < 24:
              raise SystemExit("RENDERER_TOKEN faltante o demasiado corto en GitHub")
          request = urllib.request.Request(
              base + "/api/renderer/jobs/00000000-0000-0000-0000-000000000000",
              headers={
                  "Authorization": "Bearer " + token,
                  "User-Agent": "FactorDeGigantes-Renderer/1.0",
                  "Accept": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print("Estado API autenticada:", response.status)
                  raise SystemExit("Respuesta inesperada para un trabajo inexistente")
          except urllib.error.HTTPError as exc:
              print("HTTP API autenticada:", exc.code)
              print("Server:", exc.headers.get("Server", "?"))
              print("CF-Ray presente:", bool(exc.headers.get("CF-Ray")))
              print("Content-Type:", exc.headers.get("Content-Type", "?"))
              if exc.code == 404:
                  print("RENDERER_TOKEN correcto: Worker autorizó la petición.")
              elif exc.code == 401:
                  raise SystemExit("RENDERER_TOKEN en GitHub no coincide con Cloudflare.")
              elif exc.code == 403:
                  raise SystemExit("Bloqueo HTTP 403 antes de /api/renderer: revisar Cloudflare.")
              else:
                  raise SystemExit(f"Respuesta inesperada: {exc.code}")
          PY


