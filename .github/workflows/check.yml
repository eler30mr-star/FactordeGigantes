name: Comprobar base
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Revisar sintaxis JS
        run: |
          node --check src/worker.js
          node --check public/app.js
      - name: Pruebas de contratos del renderizador
        run: python -m unittest discover -s tests -v
      - name: Validar manifest de ejemplo
        run: python tools/render.py --manifest examples/documental.json --validate-only
