name: Comprobar base
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_radar:
        description: 'Ejecutar también el radar real en main, sin publicar'
        type: boolean
        default: false
      run_script:
        description: 'Probar guionista reanudable desde D1, sin render ni publicación'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  audiovisual-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar FFmpeg para pruebas sobre archivos reales
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Verificar detección de exportaciones defectuosas sin IA ni voz nueva
        env:
          FDG_MEDIA_QA_INTEGRATION: '1'
        run: python -m unittest tests.test_av_quality -v
  live-profile:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[profile-e2e]')
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Verificar modalidad de la clave configurada sin búsquedas
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run topic-discovery-smoke.yml --ref main --repo "$GITHUB_REPOSITORY" -f phase=profile
  live-script:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && contains(github.event.head_commit.message, '[script-e2e]')) ||
       (github.event_name == 'workflow_dispatch' && inputs.run_script))
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Probar etapa de guion sin repetir radar ni inferencias de investigación
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run topic-discovery-smoke.yml --ref main --repo "$GITHUB_REPOSITORY" -f phase=script -f research_run_id=latest
  live-radar:
    # Puerta operacional explícita: un commit marcado o solicitud manual.
    # El radar recibe workflow_dispatch; OIDC sigue rechazando push.
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && contains(github.event.head_commit.message, '[radar-e2e]')) ||
       (github.event_name == 'workflow_dispatch' && inputs.run_radar))
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Solicitar una ejecución real del radar autorizado
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run topic-discovery-smoke.yml --ref main --repo "$GITHUB_REPOSITORY"
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Revisar sintaxis JS
        run: |
          node --check src/worker.js
          node --check src/ai-research-team.mjs
          node --check src/market-radar.mjs
          node --check src/market-ingest.mjs
          node --check src/github-oidc.mjs
          node --check src/news-ingest.mjs
          node --check src/news-triage.mjs
          node --check src/youtube-market.mjs
          node --check src/market-cross-signals.mjs
          node --check src/news-entity-ingest.mjs
          node --check src/market-assessment.mjs
          node --check src/market-official-ingest.mjs
          node --check src/market-pdf-ingest.mjs
          node --check src/market-research-ingest.mjs
          node --check src/market-research-selection.mjs
          node --check src/research-control.mjs
          node --check src/system-readiness.mjs
          node --check public/app.js
          node --check public/dossier-editor.js
      - name: Dependencias de pruebas PDF y animación local
        run: python -m pip install 'pypdf==5.9.0' 'Pillow==11.3.0'
      - name: Pruebas de contratos del renderizador
        run: python -m unittest discover -s tests -v
      - name: Verificar seguridad editorial en API Worker y contrato D1
        run: node --test tests/test_editorial_gate.mjs tests/test_dossier_editor.mjs tests/test_research_control.mjs tests/test_system_readiness.mjs tests/test_market_radar_api.mjs tests/test_market_ingest.mjs tests/test_github_oidc.mjs tests/test_news_ingest.mjs tests/test_news_triage.mjs tests/test_youtube_market.mjs tests/test_market_cross_signals.mjs tests/test_news_entity_ingest.mjs tests/test_market_assessment.mjs tests/test_market_official_ingest.mjs tests/test_market_pdf_ingest.mjs tests/test_market_research_ingest.mjs tests/test_market_research_selection.mjs tests/test_ai_research_team.mjs
      - name: Validar manifest de ejemplo
        run: python tools/render.py --manifest examples/documental.json --validate-only

      - name: Comprobar Worker y panel de produccion sin credenciales
        # No bloqueante: un commit de codigo puede preceder al despliegue.
        continue-on-error: true
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: python -m tools.production_smoke

      - name: Diagnosticar conexion HTTP a Cloudflare
        # Chequeo no bloqueante: distinguir secreto API_BASE_URL incorrecto de HTTP 403 externo.
        continue-on-error: true
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          base = os.environ.get("API_BASE_URL", "").rstrip("/")
          host = urllib.parse.urlsplit(base).hostname
          expected = "factor-de-gigantes.martin30-eler.workers.dev"
          print("API_BASE_URL corresponde al Worker esperado:", host == expected)
          if host != expected:
              raise SystemExit("La URL configurada en GitHub Actions no corresponde al Worker")
          request = urllib.request.Request(
              base + "/health",
              headers={"User-Agent": "FactorDeGigantes-CI/1.0", "Accept": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  body = response.read(400)
                  print("HTTP /health:", response.status)
                  print("Respuesta del Worker esperado:", b'Factor de Gigantes' in body)
          except urllib.error.HTTPError as exc:
              print("HTTP /health:", exc.code)
              print("Server:", exc.headers.get("Server", "?"))
              print("CF-Ray presente:", bool(exc.headers.get("CF-Ray")))
              print("Content-Type:", exc.headers.get("Content-Type", "?"))
              raise SystemExit(1)
          PY

      - name: Diagnosticar autenticacion del renderizador
        # Consulta un UUID imposible: 404 confirma autenticación, sin alterar un trabajo.
        continue-on-error: true
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          RENDERER_TOKEN: ${{ secrets.RENDERER_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          base = os.environ.get("API_BASE_URL", "").rstrip("/")
          token = os.environ.get("RENDERER_TOKEN", "")
          if len(token) < 24:
              raise SystemExit("RENDERER_TOKEN faltante o demasiado corto en GitHub")
          request = urllib.request.Request(
              base + "/api/renderer/jobs/00000000-0000-0000-0000-000000000000",
              headers={
                  "Authorization": "Bearer " + token,
                  "User-Agent": "FactorDeGigantes-Renderer/1.0",
                  "Accept": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print("Estado API autenticada:", response.status)
                  raise SystemExit("Respuesta inesperada para un trabajo inexistente")
          except urllib.error.HTTPError as exc:
              print("HTTP API autenticada:", exc.code)
              print("Server:", exc.headers.get("Server", "?"))
              print("CF-Ray presente:", bool(exc.headers.get("CF-Ray")))
              print("Content-Type:", exc.headers.get("Content-Type", "?"))
              if exc.code == 404:
                  print("RENDERER_TOKEN correcto: Worker autorizó la petición.")
              elif exc.code == 401:
                  raise SystemExit("RENDERER_TOKEN en GitHub no coincide con Cloudflare.")
              elif exc.code == 403:
                  raise SystemExit("Bloqueo HTTP 403 antes de /api/renderer: revisar Cloudflare.")
              else:
                  raise SystemExit(f"Respuesta inesperada: {exc.code}")
          PY

