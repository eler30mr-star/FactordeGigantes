name: Factor de Gigantes - continuidad tres parrafos CPU
on:
  workflow_dispatch:
  # Activación única del ensayo solicitada por el propietario; retirar después.
  push:
    branches: [main]
    paths:
      - '.github/workflows/voice-longform-cpu.yml'
permissions:
  contents: read
concurrency:
  group: factor-gigantes-longform-cpu
  cancel-in-progress: false
jobs:
  longform-cpu:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HOME: /tmp/qwen-longform-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar referencia y contratos antes de cargar modelo
        run: |
          python -m tools.approved_voice --check
          python -m unittest discover -s tests -p test_qwen_longform_probe.py -v
          free -h
          df -h . /tmp
          test "$(df -Pk /tmp | tail -n1 | awk '{print $4}')" -gt 8500000
      - name: Instalar PyTorch CPU (sin CUDA ni facturacion)
        run: |
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Instalar motor abierto y FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg sox
          python -m pip install 'qwen-tts==0.1.1' --no-deps
          python -m pip install 'transformers==4.57.3' 'accelerate==1.12.0' librosa soundfile sox onnxruntime einops
      - name: Generar tres parrafos y muestra concatenada
        run: |
          /usr/bin/time -v timeout -k 10s 850s python -m tools.qwen_longform_probe
          python -m tools.approved_voice --check
      - name: Subir clips, referencia y reporte para audicion
        uses: actions/upload-artifact@v4
        with:
          name: factor-gigantes-continuidad-tres-parrafos
          path: dist/continuidad-tres-parrafos/
          retention-days: 3
          if-no-files-found: error
