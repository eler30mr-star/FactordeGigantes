name: FDG - registrar exportación para revisión
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Run terminado del motor canónico; sólo registra, no sube a YouTube'
        type: string
        required: true
  workflow_run:
    workflows: ['FDG - episodio completo de desarrollo']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: fdg-stage-${{ github.event.workflow_run.id || inputs.source_run_id }}
  cancel-in-progress: false
jobs:
  register:
    if: >-
      github.event.repository.private == false &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar paquete y registrar sin aprobación ni subida
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          STAGE_EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          RENDERER_TOKEN: ${{ secrets.RENDERER_TOKEN }}
        run: |
          stage_opts=()
          if [ "$STAGE_EVENT" = 'workflow_run' ]; then stage_opts+=(--if-narrated); fi
          python -m tools.youtube_delivery register "$SOURCE_RUN_ID" --out "$RUNNER_TEMP/fdg-stage" "${stage_opts[@]}"
