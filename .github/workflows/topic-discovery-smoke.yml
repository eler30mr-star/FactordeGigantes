name: FDG - estudio YouTube y episodio seleccionado
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Estudiar oportunidades o procesar un episodio ya seleccionado'
        type: choice
        options: [opportunity, episode, acceptance, profile]
        default: opportunity
      reassess_only:
        type: boolean
        default: false
      resume_acceptance_run:
        type: string
        default: ''
      confirm_final_acceptance:
        description: 'Prueba real puntual de YouTube e IA; no cambia automático ni crea/publica videos'
        type: boolean
        default: false
      episode_id:
        type: string
        default: ''
      episode_request_id:
        type: string
        default: ''
  schedule:
    # Solo estudio YouTube: sus guardas respetan modo, pausa y episodio activo.
    - cron: '17 10 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: fdg-topic-discovery-market
  cancel-in-progress: false
jobs:
  final-market-acceptance:
    permissions:
      contents: read
      id-token: write
      actions: read
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'acceptance' && inputs.confirm_final_acceptance == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        if: inputs.resume_acceptance_run != ''
        with:
          name: fdg-final-market-acceptance
          path: dist/previous/
          run-id: ${{ inputs.resume_acceptance_run }}
          github-token: ${{ github.token }}
      - name: Ejecutar una aceptación real aislada de la producción
        env:
          REASSESS_ONLY: ${{ inputs.reassess_only }}
          RESUME_ACCEPTANCE_RUN: ${{ inputs.resume_acceptance_run }}
          CONFIRM_FINAL_ACCEPTANCE: ${{ inputs.confirm_final_acceptance }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          YOUTUBE_MARKET_BUDGET_ENABLED: ${{ vars.YOUTUBE_MARKET_BUDGET_ENABLED || '1' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_RESEARCH_FREE_CONFIRMED: ${{ vars.GEMINI_RESEARCH_FREE_CONFIRMED || '1' }}
          GROQ_RESEARCH_FREE_CONFIRMED: ${{ vars.GROQ_RESEARCH_FREE_CONFIRMED || '1' }}
          MISTRAL_RESEARCH_FREE_CONFIRMED: ${{ vars.MISTRAL_RESEARCH_FREE_CONFIRMED }}
          OPENROUTER_RESEARCH_FREE_CONFIRMED: ${{ vars.OPENROUTER_RESEARCH_FREE_CONFIRMED }}
        run: python -m tools.final_market_acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fdg-final-market-acceptance
          path: dist/final-acceptance/
          retention-days: 7
          if-no-files-found: error
  chosen-episode:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'episode' && vars.FINAL_AI_INTEGRATION_ENABLED == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preparar lectura documental sin modelos nuevos
        run: python -m pip install 'pypdf==5.9.0'
      - name: Investigar el episodio elegido y entregar guion pendiente de revisión
        env:
          EPISODE_REQUEST_ID: ${{ inputs.episode_request_id }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GEMINI_RESEARCH_FREE_CONFIRMED: ${{ vars.GEMINI_RESEARCH_FREE_CONFIRMED || '1' }}
          GROQ_RESEARCH_FREE_CONFIRMED: ${{ vars.GROQ_RESEARCH_FREE_CONFIRMED || '1' }}
          TAVILY_RESEARCH_FREE_CONFIRMED: ${{ vars.TAVILY_RESEARCH_FREE_CONFIRMED || '1' }}
          EXA_RESEARCH_FREE_CONFIRMED: ${{ vars.EXA_RESEARCH_FREE_CONFIRMED }}
        run: python -m tools.channel_episode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fdg-chosen-episode
          path: dist/channel-episode/
          retention-days: 7
          if-no-files-found: warn
  youtube-opportunity-study:
    if: >-
      github.ref == 'refs/heads/main' && github.event.repository.private == false && vars.FINAL_AI_INTEGRATION_ENABLED == '1' &&
      ((github.event_name == 'workflow_dispatch' && inputs.phase == 'opportunity') ||
       (github.event_name == 'schedule' && github.event.schedule == '17 10 * * *'))
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Estudiar YouTube solo si automático está encendido en el servidor
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          YOUTUBE_MARKET_BUDGET_ENABLED: ${{ vars.YOUTUBE_MARKET_BUDGET_ENABLED || '1' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_RESEARCH_FREE_CONFIRMED: ${{ vars.GEMINI_RESEARCH_FREE_CONFIRMED || '1' }}
          GROQ_RESEARCH_FREE_CONFIRMED: ${{ vars.GROQ_RESEARCH_FREE_CONFIRMED || '1' }}
          MISTRAL_RESEARCH_FREE_CONFIRMED: ${{ vars.MISTRAL_RESEARCH_FREE_CONFIRMED }}
          OPENROUTER_RESEARCH_FREE_CONFIRMED: ${{ vars.OPENROUTER_RESEARCH_FREE_CONFIRMED }}
        run: python -m tools.youtube_opportunity_study
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fdg-youtube-opportunity-study
          path: dist/opportunity/
          retention-days: 7
          if-no-files-found: warn
  search-provider-profile:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false && vars.FINAL_AI_INTEGRATION_ENABLED == '1' && github.event_name == 'workflow_dispatch' && inputs.phase == 'profile'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar sólo plan y cuotas Tavily, sin búsqueda ni pagos
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Propietario confirmó PAYGO apagado el 2026-10-22. Un 0 explícito prevalece.
          TAVILY_RESEARCH_FREE_CONFIRMED: ${{ vars.TAVILY_RESEARCH_FREE_CONFIRMED || '1' }}
        run: python -m tools.search_provider_profile --out dist/profile/TAVILY_PLAN_CHECK.json
      - uses: actions/upload-artifact@v4
        with:
          name: fdg-search-provider-profile
          path: dist/profile/
          retention-days: 5


