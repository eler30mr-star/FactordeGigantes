name: FDG - radar diario empresas y noticias
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Investigar o reanudar únicamente el borrador desde D1'
        type: choice
        options: [episode, opportunity, research, corroborate, review, script, profile]
        default: research
      episode_id:
        type: string
        default: ''
      episode_request_id:
        type: string
        default: ''
      research_run_id:
        description: 'Expediente ai-... o latest para la cola activa'
        type: string
        default: latest
  schedule:
    # Desarrollo: todos los jobs de proveedores requieren FINAL_AI_INTEGRATION_ENABLED=1.
    # Sólo se habilitarán para la prueba final integrada autorizada.
    # Wikimedia publica rankings diarios con retraso; 1 chequeo al día
    # evita consumo redundante. No hay IA pagada ni subida a YouTube.
    - cron: '17 10 * * *'
    # Reanuda revisión tras reinicio UTC de cuota, sin repetir radar ni búsquedas.
    - cron: '20 0 * * *'
    # Completar fuentes pendientes sin repetir radar ni analistas.
    - cron: '40 0 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: fdg-topic-discovery-market
  cancel-in-progress: false
jobs:
  chosen-episode:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'episode' && vars.FINAL_AI_INTEGRATION_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preparar lectura documental sin modelos nuevos
        run: python -m pip install 'pypdf==5.9.0'
      - name: Investigar el episodio elegido y entregar guion pendiente de revisión
        env:
          EPISODE_REQUEST_ID: ${{ inputs.episode_request_id }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GEMINI_RESEARCH_FREE_CONFIRMED: ${{ vars.GEMINI_RESEARCH_FREE_CONFIRMED || '1' }}
          GROQ_RESEARCH_FREE_CONFIRMED: ${{ vars.GROQ_RESEARCH_FREE_CONFIRMED || '1' }}
          TAVILY_RESEARCH_FREE_CONFIRMED: ${{ vars.TAVILY_RESEARCH_FREE_CONFIRMED || '1' }}
          EXA_RESEARCH_FREE_CONFIRMED: ${{ vars.EXA_RESEARCH_FREE_CONFIRMED }}
        run: python -m tools.channel_episode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fdg-chosen-episode
          path: dist/channel-episode/
          retention-days: 7
          if-no-files-found: warn
  youtube-opportunity-study:
    if: >-
      github.event.repository.private == false && vars.FINAL_AI_INTEGRATION_ENABLED == '1' &&
      ((github.event_name == 'workflow_dispatch' && inputs.phase == 'opportunity') ||
       (github.event_name == 'schedule' && github.event.schedule == '17 10 * * *'))
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Estudiar YouTube solo si automático está encendido en el servidor
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          YOUTUBE_MARKET_BUDGET_ENABLED: ${{ vars.YOUTUBE_MARKET_BUDGET_ENABLED || '1' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_RESEARCH_FREE_CONFIRMED: ${{ vars.GEMINI_RESEARCH_FREE_CONFIRMED || '1' }}
          GROQ_RESEARCH_FREE_CONFIRMED: ${{ vars.GROQ_RESEARCH_FREE_CONFIRMED || '1' }}
          MISTRAL_RESEARCH_FREE_CONFIRMED: ${{ vars.MISTRAL_RESEARCH_FREE_CONFIRMED }}
          OPENROUTER_RESEARCH_FREE_CONFIRMED: ${{ vars.OPENROUTER_RESEARCH_FREE_CONFIRMED }}
        run: python -m tools.youtube_opportunity_study
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fdg-youtube-opportunity-study
          path: dist/opportunity/
          retention-days: 7
          if-no-files-found: warn
  corroborate-existing:
    if: >-
      github.event.repository.private == false && vars.FINAL_AI_INTEGRATION_ENABLED == '1' &&
      ((github.event_name == 'workflow_dispatch' && inputs.phase == 'corroborate') ||
       (github.event_name == 'schedule' && github.event.schedule == '40 0 * * *'))
    runs-on: ubuntu-latest
    timeout-minutes: 7
    outputs:
      script_run_id: ${{ steps.contrast.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar lector PDF fijado
        run: python -m pip install 'pypdf==5.9.0'
      - name: Completar documentos y contraste sin repetir radar ni Qwen o Gemini
        id: contrast
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          RESEARCH_RUN_ID: ${{ inputs.research_run_id || 'latest' }}
          RESEARCH_PROVIDER: ${{ vars.RESEARCH_PROVIDER || 'team' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_RESEARCH_FREE_CONFIRMED: ${{ vars.TAVILY_RESEARCH_FREE_CONFIRMED || '1' }}
          EXA_RESEARCH_FREE_CONFIRMED: ${{ vars.EXA_RESEARCH_FREE_CONFIRMED }}
          GROQ_RESEARCH_FREE_CONFIRMED: ${{ vars.GROQ_RESEARCH_FREE_CONFIRMED || '1' }}
        run: python -m tools.corroborate_research --run-id "$RESEARCH_RUN_ID" --out dist/contrast/CONTRASTE_NO_APROBADO.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fdg-contraste-reanudable
          path: dist/contrast/
          retention-days: 5
          if-no-files-found: warn
  script-after-corroboration:
    needs: corroborate-existing
    if: needs.corroborate-existing.outputs.script_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Encadenar guionista sólo si el expediente ampliado supera la puerta
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_RUN_ID: ${{ needs.corroborate-existing.outputs.script_run_id }}
        run: gh workflow run topic-discovery-smoke.yml --ref main --repo "$GITHUB_REPOSITORY" -f phase=script -f research_run_id="$SCRIPT_RUN_ID"
  review-existing:
    if: >-
      github.event.repository.private == false && vars.FINAL_AI_INTEGRATION_ENABLED == '1' &&
      ((github.event_name == 'workflow_dispatch' && inputs.phase == 'review') ||
       (github.event_name == 'schedule' && github.event.schedule == '20 0 * * *'))
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      script_run_id: ${{ steps.review.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reanudar sólo el contraste por pasaje desde D1
        id: review
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          RESEARCH_RUN_ID: ${{ inputs.research_run_id || 'latest' }}
          RESEARCH_PROVIDER: ${{ vars.RESEARCH_PROVIDER || 'team' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_RESEARCH_FREE_CONFIRMED: ${{ vars.GROQ_RESEARCH_FREE_CONFIRMED || '1' }}
        run: python -m tools.review_research --run-id "$RESEARCH_RUN_ID" --out dist/review/REVISION_NO_APROBADA.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fdg-revision-reanudable
          path: dist/review/
          retention-days: 5
          if-no-files-found: warn
  script-after-review:
    needs: review-existing
    if: needs.review-existing.outputs.script_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Encadenar borrador sólo si la revisión tiene fuentes suficientes
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_RUN_ID: ${{ needs.review-existing.outputs.script_run_id }}
        run: gh workflow run topic-discovery-smoke.yml --ref main --repo "$GITHUB_REPOSITORY" -f phase=script -f research_run_id="$SCRIPT_RUN_ID"
  search-provider-profile:
    if: github.event.repository.private == false && vars.FINAL_AI_INTEGRATION_ENABLED == '1' && github.event_name == 'workflow_dispatch' && inputs.phase == 'profile'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar sólo plan y cuotas Tavily, sin búsqueda ni pagos
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Propietario confirmó PAYGO apagado el 2026-10-22. Un 0 explícito prevalece.
          TAVILY_RESEARCH_FREE_CONFIRMED: ${{ vars.TAVILY_RESEARCH_FREE_CONFIRMED || '1' }}
        run: python -m tools.search_provider_profile --out dist/profile/TAVILY_PLAN_CHECK.json
      - uses: actions/upload-artifact@v4
        with:
          name: fdg-search-provider-profile
          path: dist/profile/
          retention-days: 5
  script-after-research:
    needs: topic-discovery
    if: needs.topic-discovery.outputs.script_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Encadenar guionista sólo para el expediente con fuentes suficientes
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_RUN_ID: ${{ needs.topic-discovery.outputs.script_run_id }}
        run: gh workflow run topic-discovery-smoke.yml --ref main --repo "$GITHUB_REPOSITORY" -f phase=script -f research_run_id="$SCRIPT_RUN_ID"
  documentary-script:
    if: github.event.repository.private == false && vars.FINAL_AI_INTEGRATION_ENABLED == '1' && github.event_name == 'workflow_dispatch' && inputs.phase == 'script'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reanudar guionista desde expediente D1 sin repetir investigación
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SCRIPT_RUN_ID: ${{ inputs.research_run_id || 'latest' }}
          RESEARCH_PROVIDER: ${{ vars.RESEARCH_PROVIDER || 'team' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_RESEARCH_FREE_CONFIRMED: ${{ vars.GEMINI_RESEARCH_FREE_CONFIRMED || '1' }}
          MISTRAL_RESEARCH_FREE_CONFIRMED: ${{ vars.MISTRAL_RESEARCH_FREE_CONFIRMED }}
          OPENROUTER_RESEARCH_FREE_CONFIRMED: ${{ vars.OPENROUTER_RESEARCH_FREE_CONFIRMED }}
        run: |
          python -m tools.documentary_script --run-id "$SCRIPT_RUN_ID" \
            --out dist/script/GUION_DOCUMENTAL_NO_APROBADO.json \
            --diagnostics-out dist/script/DIAGNOSTICO_INVESTIGACION.json
      - name: Guardar guion aceptable como trabajo pendiente en el panel
        # 0014 y Worker desplegados; un 0 explícito permite desactivar.
        if: (vars.AUTONOMOUS_SCRIPT_INGEST_ENABLED || '1') == '1'
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          python -m tools.push_documentary_draft \
            --script dist/script/GUION_DOCUMENTAL_NO_APROBADO.json \
            --receipt dist/script/RECIBO_PANEL.json --probe-rejection
      - name: Preparar tareas de voz canónica y recursos por escena sin producir
        run: |
          python -m tools.documentary_production_plan \
            --script dist/script/GUION_DOCUMENTAL_NO_APROBADO.json \
            --out dist/script/PLAN_PRODUCCION_NO_APROBADO.json
      - name: Conservar borrador o bloqueo verificable para revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdg-guion-documental-revision
          path: dist/script/
          retention-days: 5
          if-no-files-found: warn
  automatic-preflight:
    if: >-
      github.event.repository.private == false && vars.FINAL_AI_INTEGRATION_ENABLED == '1' &&
      (inputs.phase == 'research' || (github.event_name == 'schedule' && github.event.schedule == '17 10 * * *'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      allowed: ${{ steps.control.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar el modo del propietario antes de cualquier búsqueda
        id: control
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: python -m tools.automatic_preflight
  topic-discovery:
    needs: automatic-preflight
    if: >-
      needs.automatic-preflight.outputs.allowed == 'true' &&
      github.event.repository.private == false && vars.FINAL_AI_INTEGRATION_ENABLED == '1' && inputs.phase != 'script' &&
      inputs.phase != 'profile' && inputs.phase != 'review' && inputs.phase != 'corroborate' &&
      (github.event_name != 'schedule' || github.event.schedule == '17 10 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 22
    outputs:
      script_run_id: ${{ steps.script-plan.outputs.run_id }}
    env:
      RESEARCH_PROVIDER: ${{ vars.RESEARCH_PROVIDER || 'team' }}
      HF_HOME: /tmp/fdg-radar-model
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar lector de PDF para fuentes originales
        run: python -m pip install 'pypdf==5.9.0'
      - name: Contrato del descubridor, sin nombres preparados ni pago
        run: python -m unittest discover -s tests -p test_topic_discovery.py -v
      - name: Consultar popularidad Wikimedia y clasificar tipo empresa en Wikidata
        run: |
          timeout -k 5s 150s python -m tools.topic_discovery \
            --limit 180 --max-requests 12 --enrich-interest \
            --out dist/radar/EMPRESAS_DESCUBIERTAS_NO_CLASIFICADAS.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('dist/radar/EMPRESAS_DESCUBIERTAS_NO_CLASIFICADAS.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          print('EMPRESAS_REALES_DETECTADAS:',data['company_candidates_count'])
          print('DIA_OBSERVADO:',data['data_day'])
          print('SERIES_INTERES_14_DIAS:',data['wikipedia_interest_measured_count'])
          print('ESTUDIO_COMPLETO:',data['market_study_complete'])
          print('YOUTUBE_PUBLICACION_PERMITIDA:',data['ready_for_youtube'])
          assert not data['market_study_complete'] and not data['ready_for_youtube']
          assert data['wikidata_requests']<=12
          PY
      - name: Guardar snapshot de mercado con esquema D1 compatible (solo SQLite local)
        run: |
          python -m unittest discover -s tests -p test_market_persistence.py -v
          python -m tools.market_persistence \
            --input dist/radar/EMPRESAS_DESCUBIERTAS_NO_CLASIFICADAS.json \
            --database dist/radar/PROVISIONAL_HISTORIAL_MERCADO.sqlite
          python - <<'PY'
          import sqlite3
          with sqlite3.connect("dist/radar/PROVISIONAL_HISTORIAL_MERCADO.sqlite") as db:
              entities=db.execute("SELECT count(*) FROM market_entities").fetchone()[0]
              series=db.execute("SELECT count(*) FROM market_interest_windows").fetchone()[0]
              print("EMPRESAS_GUARDADAS_SNAPSHOT:",entities)
              print("SERIES_HISTORICAS_GUARDADAS:",series)
              print("D1_PRODUCCION_MODIFICADA: FALSE")
          PY
      - name: Persistir radar diario con identidad GitHub OIDC efímera
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Falta API_BASE_URL para persistir radar en D1"
            exit 1
          fi
          python -m tools.push_market_radar \
            --input dist/radar/EMPRESAS_DESCUBIERTAS_NO_CLASIFICADAS.json
      - name: Descubrir titulares recientes de empresas e innovación
        run: |
          python -m unittest discover -s tests -p test_news_discovery.py -v
          timeout -k 5s 110s python -m tools.news_discovery \
            --out dist/radar/NOTICIAS_NO_VERIFICADAS.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("dist/radar/NOTICIAS_NO_VERIFICADAS.json").read_text(encoding="utf-8"))
          print("TITULARES_REALES_RECOPILADOS:",d["lead_count"])
          print("FUENTES_RSS_EXITOSAS:",d["feeds_succeeded"],"DE:",d["feeds_attempted"])
          print("HECHOS_YOUTUBE_VERIFICADOS:",d["youtube_market_verified"])
          assert not d["market_study_complete"] and not d["ready_for_youtube"]
          PY
      - name: Persistir titulares RSS no verificados en D1
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Falta API_BASE_URL; no se puede guardar radar de noticias"
            exit 1
          fi
          python -m tools.push_news_radar \
            --input dist/radar/NOTICIAS_NO_VERIFICADAS.json
      - name: Identificar compañías emergentes desde los titulares vía Wikidata
        run: |
          python -m unittest discover -s tests -p test_news_entity_discovery.py -v
          timeout -k 5s 90s python -m tools.news_entity_discovery \
            --news dist/radar/NOTICIAS_NO_VERIFICADAS.json \
            --out dist/radar/ENTIDADES_DE_NOTICIAS_NO_CONFIRMADAS.json
      - name: Persistir candidatas corporativas nuevas con GitHub OIDC
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          python -m tools.push_news_entity_assess --mode entities \
            --input dist/radar/ENTIDADES_DE_NOTICIAS_NO_CONFIRMADAS.json
      - name: Medir competencia YouTube con presupuesto explícito y limitado
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          # Propietario autorizó conectar la clave el 2026-10-22. Máximo
          # cuatro búsquedas y cuatro lecturas; la variable 0 sigue deteniendo API.
          YOUTUBE_MARKET_BUDGET_ENABLED: ${{ vars.YOUTUBE_MARKET_BUDGET_ENABLED || '1' }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          python - <<'PY'
          import os
          print('YOUTUBE_CLAVE_CONFIGURADA:',len(os.getenv('YOUTUBE_DATA_API_KEY',''))>=20)
          print('YOUTUBE_CUOTA_AUTORIZADA:',os.getenv('YOUTUBE_MARKET_BUDGET_ENABLED')=='1')
          PY
          python -m unittest discover -s tests -p test_youtube_market_study.py -v
          # Sin clave o aprobación de cuota, no realiza llamadas ni inventa resultados.
          timeout -k 5s 120s python -m tools.youtube_market_study \
            --discovery dist/radar/EMPRESAS_DESCUBIERTAS_NO_CLASIFICADAS.json \
            --out dist/radar/YOUTUBE_MUESTRAS_NO_CALIFICADAS.json
          if [ -f dist/radar/YOUTUBE_MUESTRAS_NO_CALIFICADAS.json ]; then
            python -m tools.push_youtube_study \
              --input dist/radar/YOUTUBE_MUESTRAS_NO_CALIFICADAS.json
          else
            echo "YOUTUBE_D1_SIN_CAMBIOS: falta clave, autorización de cuota o candidatos"
          fi
      - name: Elegir qué investigar desde las observaciones reales en D1
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          python -m tools.push_market_selection --out dist/radar/SELECCION_INVESTIGACION_D1.json
      - name: Recuperar sitios corporativos candidatos de Wikidata P856 con DNS seguro
        run: |
          python -m unittest discover -s tests -p test_market_official_evidence.py -v
          timeout -k 5s 75s python -m tools.market_official_evidence \
            --companies dist/radar/EMPRESAS_DESCUBIERTAS_NO_CLASIFICADAS.json \
            --news-entities dist/radar/ENTIDADES_DE_NOTICIAS_NO_CONFIRMADAS.json \
            --selection dist/radar/SELECCION_INVESTIGACION_D1.json \
            --out dist/radar/PAGINAS_OFICIALES_CANDIDATAS_SIN_VERIFICAR.json
      - name: Persistir hashes y URLs corporativas con identidad temporal GitHub
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          python -m tools.push_news_entity_assess --mode official \
            --input dist/radar/PAGINAS_OFICIALES_CANDIDATAS_SIN_VERIFICAR.json
      - name: Recuperar páginas de informes e inversores sin adivinar URLs
        run: |
          # Una única segunda tanda si las tres primeras portadas no dieron
          # contexto ni enlaces del mismo dominio. Cada tanda se persiste con
          # el contrato existente de hasta tres sitios; no se amplía D1.
          timeout -k 5s 75s python -m tools.market_official_evidence \
            --companies dist/radar/EMPRESAS_DESCUBIERTAS_NO_CLASIFICADAS.json \
            --news-entities dist/radar/ENTIDADES_DE_NOTICIAS_NO_CONFIRMADAS.json \
            --selection dist/radar/SELECCION_INVESTIGACION_D1.json \
            --previous-report dist/radar/PAGINAS_OFICIALES_CANDIDATAS_SIN_VERIFICAR.json \
            --out dist/radar/PAGINAS_OFICIALES_SEGUNDA_TANDA.json
      - name: Persistir segunda tanda y consolidar contexto local sin alterar contratos D1
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          python -m tools.push_news_entity_assess --mode official \
            --input dist/radar/PAGINAS_OFICIALES_SEGUNDA_TANDA.json
          python -m tools.market_official_evidence \
            --companies dist/radar/EMPRESAS_DESCUBIERTAS_NO_CLASIFICADAS.json \
            --news-entities dist/radar/ENTIDADES_DE_NOTICIAS_NO_CONFIRMADAS.json \
            --selection dist/radar/SELECCION_INVESTIGACION_D1.json \
            --previous-report dist/radar/PAGINAS_OFICIALES_CANDIDATAS_SIN_VERIFICAR.json \
            --combine-report dist/radar/PAGINAS_OFICIALES_SEGUNDA_TANDA.json \
            --out dist/radar/PAGINAS_OFICIALES_CONTEXTO_LOCAL.json
      - name: Recuperar informes e inversores desde ambas tandas
        run: |
          python -m unittest discover -s tests -p test_market_primary_pages.py -v
          timeout -k 5s 65s python -m tools.market_primary_pages \
            --official dist/radar/PAGINAS_OFICIALES_CONTEXTO_LOCAL.json \
            --out dist/radar/PAGINAS_INVERSORES_NO_CORROBORADAS.json
      - name: Extraer evidencia paginada de informes PDF corporativos
        run: |
          python -m unittest discover -s tests -p test_market_pdf_evidence.py -v
          timeout -k 5s 65s python -m tools.market_pdf_evidence \
            --official dist/radar/PAGINAS_OFICIALES_CONTEXTO_LOCAL.json \
            --primary-pages dist/radar/PAGINAS_INVERSORES_NO_CORROBORADAS.json \
            --out dist/radar/PDF_CORPORATIVOS_CITAS_NO_CORROBORADAS.json
      - name: Guardar páginas y citas textuales de informes en D1 vía OIDC
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          python -m tools.push_news_entity_assess --mode pdf \
            --input dist/radar/PDF_CORPORATIVOS_CITAS_NO_CORROBORADAS.json
      - name: Descubrir documentos originales con buscadores gratuitos y referencias públicas
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_RESEARCH_FREE_CONFIRMED: ${{ vars.TAVILY_RESEARCH_FREE_CONFIRMED || '1' }}
          EXA_RESEARCH_FREE_CONFIRMED: ${{ vars.EXA_RESEARCH_FREE_CONFIRMED }}
        run: |
          python - <<'PYTAVILY'
          import json,os
          from pathlib import Path
          from tools.search_provider_profile import check_tavily_profile
          result=check_tavily_profile()
          Path('dist/radar/TAVILY_PLAN_CHECK.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          if not result['free_search_confirmed']:
              with open(os.environ['GITHUB_ENV'],'a') as out:out.write('TAVILY_RESEARCH_FREE_CONFIRMED=0\n')
          print('TAVILY_PROFILE:',json.dumps(result,ensure_ascii=False))
          PYTAVILY
          # GITHUB_ENV sólo afecta pasos posteriores; aplicar también en este proceso.
          export TAVILY_RESEARCH_FREE_CONFIRMED=$(python -c "import json;print('1' if json.load(open('dist/radar/TAVILY_PLAN_CHECK.json'))['free_search_confirmed'] else '0')")
          timeout -k 5s 180s python -m tools.ai_research_pipeline discover \
            --selection dist/radar/SELECCION_INVESTIGACION_D1.json \
            --pdf dist/radar/PDF_CORPORATIVOS_CITAS_NO_CORROBORADAS.json \
            --official dist/radar/PAGINAS_OFICIALES_CONTEXTO_LOCAL.json \
            --primary dist/radar/PAGINAS_INVERSORES_NO_CORROBORADAS.json \
            --out dist/radar/FUENTES_EQUIPO_IA.json
      - name: Comprobar evidencia antes de descargar Qwen
        id: research-plan
        run: |
          python - <<'PYPLAN'
          import json,os
          from pathlib import Path
          from tools.ai_research_pipeline import source_report,validate_report_locally
          report=json.loads(Path('dist/radar/FUENTES_EQUIPO_IA.json').read_text())
          validate_report_locally(source_report(report))
          needed=bool(report['evidence_manifest']) and os.getenv('RESEARCH_PROVIDER')!='disabled'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f"qwen_needed={'true' if needed else 'false'}\n")
          print('PASAJES_EQUIPO_IA:',len(report['evidence_manifest']))
          PYPLAN
      - name: Instalar auxiliar Qwen local CPU solo cuando hay contexto
        if: steps.research-plan.outputs.qwen_needed == 'true'
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.57.3' 'accelerate==1.12.0'
      - name: Analizar, revisar y guardar el equipo IA en D1
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Propietario confirmó Nivel gratuito de AI Studio (22 oct 2026).
          # El valor explícito 0 en Variables de Actions siempre desactiva.
          GEMINI_RESEARCH_FREE_CONFIRMED: ${{ vars.GEMINI_RESEARCH_FREE_CONFIRMED || '1' }}
          # Captura GroqCloud: plan Gratis ($0), 22 oct 2026.
          # La revisión no confirma hechos ni autoriza producción.
          GROQ_RESEARCH_FREE_CONFIRMED: ${{ vars.GROQ_RESEARCH_FREE_CONFIRMED || '1' }}
          MISTRAL_RESEARCH_FREE_CONFIRMED: ${{ vars.MISTRAL_RESEARCH_FREE_CONFIRMED }}
          OPENROUTER_RESEARCH_FREE_CONFIRMED: ${{ vars.OPENROUTER_RESEARCH_FREE_CONFIRMED }}
        run: |
          timeout -k 10s 540s python -m tools.ai_research_pipeline analyze \
            --sources dist/radar/FUENTES_EQUIPO_IA.json \
            --out dist/radar/EQUIPO_IA_NO_APROBADO.json
      - name: Preparar plan documental desde investigación propia, sin fabricar guion
        id: script-plan
        run: |
          python -m unittest discover -s tests -p test_documentary_blueprint.py -v
          python -m tools.documentary_blueprint \
            --research dist/radar/EQUIPO_IA_NO_APROBADO.json \
            --selection dist/radar/SELECCION_INVESTIGACION_D1.json \
            --out dist/radar/PLAN_DOCUMENTAL_NO_APROBADO.json
          python - <<'PYDRAFT'
          import json,os,re
          from pathlib import Path
          plan=json.loads(Path('dist/radar/PLAN_DOCUMENTAL_NO_APROBADO.json').read_text())
          receipt=json.loads(Path('dist/radar/EQUIPO_IA_NO_APROBADO.receipt.json').read_text())
          run_id=receipt.get('run_id','')
          if plan['status']=='source_grounded_outline_unapproved' and re.fullmatch(r'ai-[a-f0-9]{28}',run_id):
              with open(os.environ['GITHUB_OUTPUT'],'a') as out:
                  out.write('run_id='+run_id+'\n')
          PYDRAFT
      - name: Relacionar empresas y titulares como hipótesis verificables
        run: |
          python -m unittest discover -s tests -p test_market_news_join.py -v
          python -m tools.market_news_join \
            --companies dist/radar/EMPRESAS_DESCUBIERTAS_NO_CLASIFICADAS.json \
            --news dist/radar/NOTICIAS_NO_VERIFICADAS.json \
            --out dist/radar/COINCIDENCIAS_EMPRESA_NOTICIA_SIN_VERIFICAR.json
      - name: Persistir coincidencias informativas con identidad OIDC
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          python -m tools.push_market_cross \
            --input dist/radar/COINCIDENCIAS_EMPRESA_NOTICIA_SIN_VERIFICAR.json
      - name: Evaluar oportunidades desde D1 y registrar bloqueos reales
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          python -m tools.push_news_entity_assess --mode assess
      - name: Conservar únicamente informe de candidatos y procedencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdg-empresas-descubiertas-wikimedia
          path: dist/radar/
          retention-days: 5
          if-no-files-found: warn


