name: Factor de Gigantes - investigador IA local CPU
run-name: "FDG Investigación · ${{ inputs.request_id || 'manual' }}"
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'ID de solicitud generado por el panel; opcional si lanzas manualmente'
        required: false
        type: string
        default: ''
      topic:
        description: 'Tema libre (vacío = piloto con fuentes primarias BlackBerry)'
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: factor-gigantes-research-ai-local
  cancel-in-progress: false
jobs:
  investigation:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HF_HOME: /tmp/factor-hf-research
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contratos de investigación sin conexión de pago
        run: |
          python -m unittest discover -s tests -p test_research_engine.py -v
          python -m unittest discover -s tests -p test_local_research_ai.py -v
      - name: Investigar un tema libre o el piloto BlackBerry
        env:
          RESEARCH_TOPIC: ${{ inputs.topic }}
        run: |
          if [ -n "$RESEARCH_TOPIC" ]; then
            timeout -k 5s 140s python -m tools.research_engine \
              --topic "$RESEARCH_TOPIC" --max-requests 3 --out dist/investigacion
          else
            timeout -k 5s 140s python -m tools.research_engine \
              --dossier research/blackberry/expediente_preliminar.json \
              --max-requests 6 --out dist/investigacion
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("dist/investigacion/reporte_investigacion.json").read_text())
          print("Documentos obtenidos:",p["fetched_count"],"/",p["request_count"])
          print("Pasajes candidatos:",sum(len(c["candidate_passages"]) for c in p["candidate_claims"]))
          print("Comprobaciones humanas realizadas por la herramienta:",p["facts_verified_automatically"])
          print("Tipo de fuente inicial:",p.get("source_quality","proporcionada en expediente; revisar su tipo"))
          PY
      - name: Descubrir posibles fuentes oficiales desde el tema
        if: inputs.topic != ''
        continue-on-error: true
        env:
          RESEARCH_TOPIC: ${{ inputs.topic }}
        run: |
          timeout -k 5s 85s python -m tools.primary_source_discovery \
            --topic "$RESEARCH_TOPIC" --max-entities 2 --out dist/investigacion
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("dist/investigacion/fuentes_oficiales_candidatas.json")
          if path.exists():
              result=json.loads(path.read_text())
              print("Candidatos oficiales (NO verificados):",result["official_candidates"])
              print("Verificación de hechos:",result["automatic_fact_verification"])
          PY
      - name: Instalar modelo abierto y PyTorch SOLO CPU
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.57.3' 'accelerate==1.12.0' 'sentencepiece>=0.2.0'
      - name: IA local genera borrador solo con los pasajes extraídos
        run: |
          /usr/bin/time -v timeout -k 10s 540s python -m tools.local_research_ai \
            --report dist/investigacion/reporte_investigacion.json \
            --out dist/investigacion \
            --model Qwen/Qwen3-0.6B --max-new-tokens 235
      - name: Entregar informe de fuentes y borrador no verificado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factor-investigacion-ia-cpu
          path: dist/investigacion/
          retention-days: 3
          if-no-files-found: warn
