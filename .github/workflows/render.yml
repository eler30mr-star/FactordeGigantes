name: Render de prueba
run-name: Render ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: UUID del trabajo aprobado en el panel
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: render-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Instalar FFmpeg y Piper neuronal
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install Pillow==11.3.0 piper-tts==1.8.0
      - name: Cachear modelo neuronal gratuito
        uses: actions/cache@v4
        with:
          path: ~/.cache/factor-de-gigantes/voices
          key: piper-es-MX-ald-019b3803
      - name: Obtener guion aprobado y renderizar
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          RENDERER_TOKEN: ${{ secrets.RENDERER_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
        run: python tools/render.py --remote --job-id "$JOB_ID" --voice-engine piper --captions burn --output dist/video.mp4
      - name: Inspeccionar exportación antes de reportarla como lista
        run: |
          PROFILE=$(python -c "import json;print('short' if json.load(open('dist/ficha.json'))['format']=='short' else 'preview')")
          python -m tools.av_quality dist/video.mp4 --profile "$PROFILE" --out dist/QA_AUDIOVISUAL.json
      - name: Conservar diagnóstico audiovisual incluso si la puerta falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-audiovisual-${{ inputs.job_id }}
          path: dist/QA_AUDIOVISUAL.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Subir video de prueba como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: vista-previa-${{ inputs.job_id }}
          path: |
            dist/video.mp4
            dist/subtitulos.srt
            dist/ficha.json
            dist/creditos.txt
            dist/QA_AUDIOVISUAL.json
          if-no-files-found: error
          retention-days: 7
      - name: Reportar resultado correcto
        if: success()
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          RENDERER_TOKEN: ${{ secrets.RENDERER_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
        run: python tools/report.py ready "$JOB_ID"
      - name: Reportar fallo
        if: failure()
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          RENDERER_TOKEN: ${{ secrets.RENDERER_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
        run: python tools/report.py failed "$JOB_ID"
